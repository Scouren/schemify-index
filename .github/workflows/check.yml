name: check
# Every pull request: the checker's own tests, then each changed listing (format, every URL
# fetched and hashed, image caps and PNG, grant growth). Runs as
# `pull_request` (never `pull_request_target`): a fork's code gets no token and no secret.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: checker tests
        run: python3 check/test_check.py
      - name: listings
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: python3 check/check.py --base "$BASE"
